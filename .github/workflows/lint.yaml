name: Lint & Validate

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  terraform:
    name: Terraform Checks
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      - name: Init TFLint
        run: tflint --init
        env:
          # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: tflint -f compact --recursive

      - name: Terraform Init & Validate
        run: |
          # Determine comparison base
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_sha="origin/${{ github.base_ref }}"
          else
            BASE_sha="HEAD~1"
          fi
          
          echo "Determining changed modules against $BASE_sha..."
          CHANGED_FILES=$(git diff --name-only "$BASE_sha")
          
          find modules examples -name "versions.tf" -exec dirname {} \; | sort -u | while read dir; do
            # Check if any changed file starts with the module directory path
            if echo "$CHANGED_FILES" | grep -q "^$dir/"; then
              echo "📝 Changes detected in '$dir'. Validating..."
              cd "$dir"
              terraform init -backend=false
              terraform validate
              cd - > /dev/null
            else
              echo "⏭️  No changes in '$dir'. Skipping."
            fi
          done
