name: Auto Tag Release

on:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'

jobs:
  tag-release:
    name: Tag Release from Changelog
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Latest Version
        id: extract_version
        run: |
          # Extract the top-most version header (e.g., "## [v0.2.1]")
          # Usage of grep and head gets the first match. output matches "[v0.2.1]"
          VERSION_HEADER=$(grep -m 1 "^## \[" CHANGELOG.md)
          
          if [ -z "$VERSION_HEADER" ]; then
            echo "No version header found in CHANGELOG.md"
            exit 1
          fi

          # Extract "v0.2.1" from "## [v0.2.1] - 2026-01-03"
          # sed regex: matches '## [' then captures the version inside ']'
          VERSION=$(echo "$VERSION_HEADER" | sed -n 's/^## \[\(.*\)\] .*/\1/p')

          if [ -z "$VERSION" ]; then
            echo "Could not parse version from header: $VERSION_HEADER"
            exit 1
          fi

          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check and Push Tag
        id: check_push
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. Skipping."
            echo "new_tag=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Tag $VERSION does not exist. Creating..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
            echo "Successfully pushed tag $VERSION"
            echo "new_tag=true" >> $GITHUB_OUTPUT
          fi

      - name: Extract Release Notes
        if: steps.check_push.outputs.new_tag == 'true'
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          # Extract the section for this tag from CHANGELOG.md
          awk -v tag="[$VERSION]" '/^## / { if ($2 == tag) { flag=1; next } else { flag=0 } } flag' CHANGELOG.md > RELEASE_NOTES.md
          
          echo "Extracted Notes:"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        if: steps.check_push.outputs.new_tag == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.extract_version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
